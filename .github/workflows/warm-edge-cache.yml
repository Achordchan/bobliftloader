name: Warm Edge Cache

# The WordPress.com edge cache answers a page's first request after five minutes with its old copy, and keeps one copy per
# compression (br, gzip, none), so a page nobody visits keeps an old copy for its next visitor: on 2026-11-17 the English
# pages were served without their Spanish hreflang links for a while after the Spanish pages went live
# (scripts/warm-edge-cache.py).
# - Every six hours, and by hand after articles are published (recent_hours): the home, range and news list pages in
#   both languages, which takes about a minute. The sitemap has no <lastmod>, and a new article's page has no old copy.
# - Once a week (Sunday 03:17 Singapore time), and by hand with recent_hours empty after a theme change that matters to
#   search engines: every sitemap page, as br and gzip.
# A full run used to follow every deploy and first wait ten minutes for it. The account's 3,000 included Actions minutes
# ran out on 2026-11-17, mostly to those post-deploy runs on the crane site, so deploys no longer start one here either:
# a visitor still gets each page's new copy from its second request on.
on:
  schedule:
    - cron: "41 */6 * * *"
    - cron: "17 19 * * 6"
  workflow_dispatch:
    inputs:
      recent_hours:
        description: "Only the list pages (any number; empty = every sitemap page)"
        required: false
        default: ""
jobs:
  Warm-Edge-Cache:
    # One run at a time keeps the requests under the host's rate limit (429); a new run waits for the one in progress.
    concurrency:
      group: warm-edge-cache
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Request the pages
        env:
          # The six-hourly run warms the list pages; the weekly one leaves RECENT empty for every sitemap page.
          RECENT: ${{ github.event_name == 'schedule' && (github.event.schedule != '17 19 * * 6' && '7' || '') || github.event.inputs.recent_hours }}
        run: |
          lists='/,news/,products/skid-steer-loaders/,products/mini-dumpers/'
          if [ -n "$RECENT" ]; then
            python3 scripts/warm-edge-cache.py https://bobliftloader.com --recent "$RECENT" --lists "$lists"
          else
            python3 scripts/warm-edge-cache.py https://bobliftloader.com
          fi
